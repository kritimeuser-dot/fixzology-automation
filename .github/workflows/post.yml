name: Fixzology Auto Reel
on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *'
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python main.py
      - uses: actions/upload-artifact@v4
        with:
          name: fixzology-output
          path: |
            video.mp4
            script.txt
